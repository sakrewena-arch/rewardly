name: Electron Build

on:
  push:
    branches: [main, develop]
    paths: ['desktop/**', 'src/**', 'package.json']
  workflow_dispatch:

jobs:
  build:
    name: Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix desktop

      - name: Regénérer dist (attendu par le wrapper)
        run: npm run build:dist

      - name: Build Electron
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewardly-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
          if-no-files-found: warn
