name: Android Build

on:
  push:
    branches: [main, develop]
    paths: ['android/**', 'src/**', 'package.json']
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (dist + plugins)
        env:
          WRAPPER_APP_URL: ${{ secrets.WRAPPER_APP_URL }}
        run: npm run build:dist && npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Le build release est TOUJOURS lancé. La signature est gérée dans
      # build.gradle : si les variables ANDROID_KEYSTORE_* sont fournies (secrets
      # du dépôt), l'APK est signé ; sinon il reste non signé (utilisable en test).
      - name: Décode le keystore (si le secret existe)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/rewardly-release.jks
            ls -la android/keystore/
            echo "KEYSTORE_DECODE_OK"
          else
            echo "Aucun keystore fourni — APK non signé"
          fi

      - name: Build release APK
        env:
          # Chemin absolu : interprété par build.gradle via rootProject.file()
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/rewardly-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: rewardly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: rewardly-release-apk
          # app-release.apk (signé) OU app-release-unsigned.apk (sans secrets)
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
