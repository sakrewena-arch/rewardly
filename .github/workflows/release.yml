name: Release Native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Nécessaire pour créer/éditer la GitHub Release et uploader les assets
permissions:
  contents: write

jobs:
  build-electron:
    name: Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix desktop

      # AppImage nécessite libfuse2 sur les runners Ubuntu
      - name: Préparer l'environnement Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Synchroniser la version native
        run: node scripts/sync-native-versions.mjs

      - name: Build dist
        run: npm run build:dist

      - name: Build Electron
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
          if-no-files-found: warn

  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (dist + plugins)
        env:
          WRAPPER_APP_URL: ${{ secrets.WRAPPER_APP_URL }}
        run: npm run build:dist && npx cap sync android

      - name: Build release APK (signé si secrets fournis)
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: installers-apk
          # app-release.apk (signé) OU app-release-unsigned.apk (sans secrets)
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Publier GitHub Release
    needs: [build-electron, build-android]
    # S'exécute même si un job de build échoue : on publie les installateurs
    # des plateformes qui ont réussi (ex: Windows/macOS OK, Linux KO).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: installers-*
          merge-multiple: true
        continue-on-error: true

      - name: Vérifier la présence d'assets
        id: check-assets
        run: |
          count=$(find dist-artifacts -type f 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "ASSETS=$count"

      - name: Create Release
        if: steps.check-assets.outputs.count > '0'
        uses: softprops/action-gh-release@v2
        with:
          name: Rewardly ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          # Publier immédiatement (non-brouillon) pour que la page /download
          # la voie via l'API publique (les brouillons n'y sont pas exposés).
          draft: false
          generate_release_notes: true
          files: dist-artifacts/**
